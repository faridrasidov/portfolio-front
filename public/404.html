<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="noindex, follow" name="robots"/>
  <meta content="The requested page could not be found." name="description"/>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
  <title>Page Not Found | Farid Rashidov</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #050509;
      color: #f5f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(131, 73, 255, 0.22), transparent 34%),
        radial-gradient(circle at 80% 75%, rgba(0, 218, 255, 0.14), transparent 30%),
        #050509;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(139, 92, 246, 0.45);
      background: rgba(10, 10, 18, 0.88);
      box-shadow: 0 0 50px rgba(109, 40, 217, 0.16);
      text-align: center;
    }

    p:first-child {
      margin: 0 0 12px;
      color: #a78bfa;
      font-family: monospace;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 5rem);
      line-height: 1;
    }

    .message {
      margin: 24px auto 32px;
      max-width: 480px;
      color: #b9b9c5;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border: 1px solid #8b5cf6;
      color: #ffffff;
      text-decoration: none;
      font-family: monospace;
      transition: background 160ms ease, box-shadow 160ms ease;
    }

    a:hover,
    a:focus-visible {
      background: rgba(139, 92, 246, 0.18);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.28);
    }
  </style>
</head>
<body>
<main>
  <p>ERROR // 404</p>
  <h1>Lost in space?</h1>
  <p class="message">It looks like that page does not exist. Check the URL or return to the portfolio homepage.</p>
  <a href="/">GO BACK HOME</a>
</main>
</body>
</html>
